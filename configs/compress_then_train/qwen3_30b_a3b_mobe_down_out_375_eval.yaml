# EVAL of the down_proj-only OUTPUT-side 37.5% checkpoint (Phase 2).
# train_mode: full -> no compression; load the pre-compressed hf_reconstructed
# checkpoint and benchmark PPL(wiki2,c4) + HellaSwag(0-shot) + MMLU(5-shot),
# sharded across the free GPUs.
#
# model_name_or_path is patched to the Phase-1 run's hf_reconstructed dir before
# launch (timestamped; filled in by the orchestrator).
#
# Launch:
#   FORCE_DEVICE_MAP_AUTO=1 PER_GPU_MEM=36GiB ATTN_IMPLEMENTATION=sdpa \
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   .venv/bin/python src/compress_then_train.py --config <this>

model_name_or_path: __FILL_IN_HF_RECONSTRUCTED_DIR__
lr: 1.0e-4
optimizer: adamw
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
seed: 42

no_wandb: true

train_mode: full
compression_ratio: 0.625
skip_layers: lm_head

kd_loss_type: ce
ce_data_source: c4
ce_seq_len: 2048
ce_steps: 1
save_steps: none
base_dir: outputs/compress_then_train
one_shot_eval_only: true

run_lm_eval: true
eval_before_compression: true
eval_after_compression: false
eval_every_steps: 0
lm_eval_tasks: hellaswag,mmlu
lm_eval_limit: -1
lm_eval_batch_size: 8
lm_eval_max_seqlen: 2048
