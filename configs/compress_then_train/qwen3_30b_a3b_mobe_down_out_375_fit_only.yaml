# down_proj-ONLY MoBE @ 37.5% reduction, shared basis on the OUTPUT (hidden d)
# side. gate_proj/up_proj left DENSE. Phase 1: FIT + SAVE ONLY (no eval).
#
# down_proj is (out=d=2048, in=p=768). Output-side basis => fit down_projᵀ:
#   A_e (p, r), B (m, r, d),  gamma = r/d + m/n  (with r=p=768)
#   m=32, r=768 -> gamma = 0.625 -> down_proj reduced EXACTLY 37.5%.
# Only down_proj is compressed, so whole-MoE reduction ~= 37.5%/3 ~= 12.5%.
#
# Companion input-side run: qwen3_30b_a3b_mobe_down_in_375_fit_only.yaml (r=439).
# Eval both via qwen3_30b_a3b_mobe_down_{out,in}_375_eval.yaml.
#
# Launch (single GPU, model on CPU):
#   CUDA_VISIBLE_DEVICES=<g> MODEL_ON_CPU=1 ATTN_IMPLEMENTATION=sdpa \
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#   .venv/bin/python src/compress_then_train.py --config <this>

model_name_or_path: Qwen/Qwen3-30B-A3B
name_suffix: _downout375        # distinct run dir (avoid same-second collision)
lr: 1.0e-4
optimizer: adamw
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
seed: 42

no_wandb: true

# ── MoBE decomposition (data-free), down_proj ONLY, output-side basis ─────────
train_mode: mobe
compression_ratio: 0.625
moe_basis_count: 32              # m
moe_basis_rank: 768              # r (= p = d-side rank) -> gamma=0.625
moe_compress_gate_up: false      # leave gate_proj/up_proj DENSE
moe_compress_down: true
moe_down_basis_side: output      # shared basis spans hidden d (fit down_projᵀ)
moe_fit_iters: 2000
moe_fit_lr: 0.07
moe_fit_patience: 0
moe_z_norm: true
moe_fit_log_every: 500
moe_save_native: true
moe_save_hf_reconstructed: true

calib_source: c4
eval_ppl_after_compression: false   # DISABLED (model on CPU)
eval_ppl_seqlen: 2048
skip_layers: lm_head

kd_loss_type: ce
ce_data_source: c4
ce_seq_len: 2048
ce_steps: 1
save_steps: none
base_dir: outputs/compress_then_train
one_shot_eval_only: true

run_lm_eval: false
eval_before_compression: false
eval_after_compression: false
eval_every_steps: 0
lm_eval_tasks: hellaswag,mmlu
lm_eval_limit: -1
lm_eval_batch_size: 8
lm_eval_max_seqlen: 2048
